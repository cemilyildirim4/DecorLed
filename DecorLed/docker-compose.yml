version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine 
    container_name: decorled_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: DecorLedDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: